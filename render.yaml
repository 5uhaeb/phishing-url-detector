services:
  - type: web
    name: linkguard-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: HOST
        value: 0.0.0.0
      - key: MODEL_NAME
        value: xgboost
      - key: PUBLIC_FEED_KEYS
        value: phishing_database
      - key: REFRESH_FEEDS
        value: '1'
      - key: FRONTEND_ORIGINS
        sync: false
