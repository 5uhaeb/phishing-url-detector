services:
  - type: web
    name: linkguard-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt -r dependencies.lock.txt && python release.py fetch
    startCommand: python app.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: HOST
        value: 0.0.0.0
      - key: MODEL_PATH
        value: release/current/runtime-model.joblib
      - key: EVALUATION_PATH
        value: release/current/evaluation.json
      - key: MODEL_MMAP
        value: "1"
      - key: FRONTEND_ORIGINS
        sync: false
      - key: WEB_CONCURRENCY
        value: 1
      - key: PUBLIC_FEED_KEYS
        value: phishing_database
