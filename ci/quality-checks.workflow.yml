name: Quality checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt -r dependencies.lock.txt
      - run: python -m pip check
      - run: python -m unittest test_training test_release -v
      - run: python release.py fetch
      - run: python -m unittest test_detector -v
        env:
          MODEL_PATH: release/current/runtime-model.joblib
          EVALUATION_PATH: release/current/evaluation.json
          MODEL_MMAP: '1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run check && npm run build
        working-directory: frontend
